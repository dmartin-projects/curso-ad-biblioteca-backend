[project]
name = "biblioteca"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django[argon2]>=6.1,<6.2",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.3.6",
    "rules>=3.5",
    "pillow>=13.0.0",
    "django-storages[s3]>=1.14.6",
    "whitenoise>=6.12.0",
    "weasyprint>=70.0",
    "redis[hiredis]>=8.1.0",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.54.0",
    "channels[daphne]>=4.3.2",
    "channels-redis>=4.3.0",
    "django-tasks-db>=0.13.0",
    "flower>=2.2.0",
    "celery>=5.6",
    "tenacity>=9.2.1",
    "django-cors-headers>=4.9.0",
    "python-json-logger>=4.2.0",
    "sentry-sdk[celery,django]>=2.72.0",
    "djangorestframework>=3.18.3",
    "django-filter>=26.2",
    "drf-spectacular>=0.30.0",
    "djangorestframework-simplejwt>=5.5.1",
    "python-magic>=0.4.27",
]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "django-debug-toolbar>=8.0.0",
    "django-silk>=5.6.0",
    "factory-boy>=3.3.3",
    "faker>=40.43.0",
    "ipython>=9.17.1",
    "moto[s3]>=5.2.4",
    "pypdf>=6.21.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-mock>=3.17.0",
    "pytest-xdist>=3.8.0",
    "redis>=8.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "time-machine>=3.5.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "--strict-markers -ra"  # sin --reuse-db: ver la nota del módulo 31
filterwarnings = ["error::RuntimeWarning"]  # p. ej. datetimes sin zona → fallo

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests/*", "config/*", "manage.py", "conftest.py"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
