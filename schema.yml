  /api/v1/libros/:
    get:
      operationId: libros_list
      parameters:
      - in: query
        name: autor
        schema:
          type: string
      - in: query
        name: disponible
        schema:
          type: boolean
      - in: query
        name: genero
        schema:
          type: array
          items:
            type: integer
        explode: true
        style: form
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: paginas_max
        schema:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
      - in: query
        name: paginas_min
        schema:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
      - in: query
        name: publicado_desde
        schema:
          type: string
          format: date
      - in: query
        name: publicado_hasta
        schema:
          type: string
          format: date
      - name: search
