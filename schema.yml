    post:
      operationId: prestamos_renovar_create
      description: 'Sin update ni destroy: un préstamo cambia solo con acciones de
        negocio.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este préstamo.
        required: true
      tags:
      - prestamos
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prestamo'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'
          description: ''
  /api/v1/prestamos/exportar/:
    get:
      operationId: prestamos_exportar_retrieve
      description: 'CSV en streaming con los MISMOS filtros que el listado: exportas
        lo que ves.'
      tags:
      - prestamos
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: ''
  /api/v1/prestamos/vencidos/:
    get:
      operationId: prestamos_vencidos_retrieve
      description: 'Sin update ni destroy: un préstamo cambia solo con acciones de
        negocio.'
      tags:
      - prestamos
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prestamo'
          description: ''
components:
  schemas:
    Access:
      type: object
      properties:
        access:
          type: string
          description: JWT de acceso; el refresh va en una cookie HttpOnly
      required:
      - access
    Autor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 200
        apellidos:
          type: string
          maxLength: 200
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        nacimiento:
          type: string
          format: date
          nullable: true
      required:
      - id
      - nombre
      - slug
    AutorRequest:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        apellidos:
          type: string
          maxLength: 200
        nacimiento:
          type: string
          format: date
          nullable: true
      required:
      - nombre
    CambiarPasswordRequest:
      type: object
      properties:
        actual:
          type: string
          writeOnly: true
          minLength: 1
        nueva:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - actual
      - nueva
    CompletarRegistroRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - token
      - uid
    ConfirmarRecuperacionRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - token
      - uid
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    Estadisticas:
      type: object
      description: Solo documenta la respuesta (drf-spectacular no puede deducirla
        de un aggregate).
      properties:
        libros:
          type: integer
        con_ejemplares_disponibles:
          type: integer
      required:
      - con_ejemplares_disponibles
      - libros
    EstadoPrestamoEnum:
      enum:
      - activo
      - devuelto
      type: string
      description: |-
        * `activo` - Activo
        * `devuelto` - Devuelto
    Genero:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 100
        padre:
          type: integer
          nullable: true
      required:
      - id
      - nombre
    GeneroRequest:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        padre:
          type: integer
          nullable: true
      required:
      - nombre
    IdiomaEnum:
      enum:
      - es
      - en
      type: string
      description: |-
        * `es` - Español
        * `en` - Inglés
    Libro:
      type: object
      description: Objeto para leer (autores), ids para escribir (autores_ids).
      properties:
        id:
          type: integer
          readOnly: true
        titulo:
          type: string
          maxLength: 300
        isbn:
          type: string
          maxLength: 13
        publicado:
          type: string
          format: date
          nullable: true
        paginas:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        sinopsis:
          type: string
        autores:
          type: array
          items:
            $ref: '#/components/schemas/Autor'
          readOnly: true
        generos:
          type: array
          items:
            type: integer
      required:
      - autores
      - id
      - isbn
      - titulo
    LibroLista:
      type: object
      description: Pocos campos para listados. Espera Libro.objects.para_listado().con_disponibles().
      properties:
        id:
          type: integer
          readOnly: true
        titulo:
          type: string
          maxLength: 300
        isbn:
          type: string
          maxLength: 13
        publicado:
          type: string
          format: date
          nullable: true
        autores:
          type: array
          items:
            type: string
        generos:
          type: array
          items:
            type: string
          readOnly: true
        ejemplares_disponibles:
          type: integer
          readOnly: true
      required:
      - autores
      - ejemplares_disponibles
      - generos
      - id
      - isbn
      - titulo
    LibroMini:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        titulo:
          type: string
          maxLength: 300
        isbn:
          type: string
          maxLength: 13
      required:
      - id
      - isbn
      - titulo
    LibroRequest:
      type: object
      description: Objeto para leer (autores), ids para escribir (autores_ids).
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 300
        isbn:
          type: string
          minLength: 1
          maxLength: 13
        publicado:
          type: string
          format: date
          nullable: true
        paginas:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        sinopsis:
          type: string
        autores_ids:
          type: array
          items:
            type: integer
            writeOnly: true
          writeOnly: true
        generos:
          type: array
          items:
            type: integer
      required:
      - autores_ids
      - isbn
      - titulo
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    Mensaje:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    PaginatedAutorList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Autor'
        total_pages:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    PaginatedLibroListaList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/LibroLista'
        total_pages:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    PaginatedPrestamoList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Prestamo'
    PatchedAutorRequest:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        apellidos:
          type: string
          maxLength: 200
        nacimiento:
          type: string
          format: date
          nullable: true
    PatchedGeneroRequest:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        padre:
          type: integer
          nullable: true
    PatchedLibroRequest:
      type: object
      description: Objeto para leer (autores), ids para escribir (autores_ids).
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 300
        isbn:
          type: string
          minLength: 1
          maxLength: 13
        publicado:
          type: string
          format: date
          nullable: true
        paginas:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        sinopsis:
          type: string
        autores_ids:
          type: array
          items:
            type: integer
            writeOnly: true
          writeOnly: true
        generos:
          type: array
          items:
            type: integer
    PatchedUsuarioRequest:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 150
        apellidos:
          type: string
          maxLength: 150
        idioma:
          $ref: '#/components/schemas/IdiomaEnum'
        zona_horaria:
          type: string
          minLength: 1
          maxLength: 50
    Portada:
      type: object
      description: PUT /libros/{id}/portada/ (multipart).
      properties:
        portada:
          type: string
          format: uri
          pattern: (?:jpg|jpeg|png|webp)$
      required:
      - portada
    PortadaRequest:
      type: object
      description: PUT /libros/{id}/portada/ (multipart).
      properties:
        portada:
          type: string
          format: binary
          pattern: (?:jpg|jpeg|png|webp)$
      required:
      - portada
    Prestamo:
      type: object
      description: 'SALIDA: el préstamo con su libro anidado.'
      properties:
        id:
          type: integer
          readOnly: true
        libro:
          allOf:
          - $ref: '#/components/schemas/LibroMini'
          readOnly: true
        ejemplar:
          type: string
          readOnly: true
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoPrestamoEnum'
          readOnly: true
        fecha_inicio:
          type: string
          format: date-time
          readOnly: true
          title: Fecha de inicio
        fecha_limite:
          type: string
          format: date-time
          readOnly: true
          title: Fecha límite
        multa:
          type: string
          nullable: true
          readOnly: true
      required:
      - ejemplar
      - estado
      - fecha_inicio
      - fecha_limite
      - id
      - libro
      - multa
    PrestarRequest:
      type: object
      description: 'ENTRADA: lo único que el cliente puede decidir. El socio es quien
        llama.'
      properties:
        ejemplar_id:
          type: integer
          minimum: 1
      required:
      - ejemplar_id
    Problema:
      type: object
      description: El formato único de error de la API (core.api.exceptions).
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          nullable: true
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          nullable: true
        request_id:
          type: string
      required:
      - detail
      - errors
      - request_id
      - status
      - title
      - type
    RegistroRequest:
      type: object
      description: 'Solo datos que no son secretos: la contraseña se elige al completar
        el registro.'
      properties:
        email:
          type: string
          format: email
          minLength: 1
        nombre:
          type: string
          maxLength: 150
        apellidos:
          type: string
          maxLength: 150
      required:
      - email
    TicketWs:
      type: object
      properties:
        ticket:
          type: string
        caduca_en:
          type: integer
          description: Segundos
      required:
      - caduca_en
      - ticket
    Usuario:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        nombre:
          type: string
          maxLength: 150
        apellidos:
          type: string
          maxLength: 150
        idioma:
          $ref: '#/components/schemas/IdiomaEnum'
        zona_horaria:
          type: string
          maxLength: 50
        fecha_alta:
          type: string
          format: date-time
          readOnly: true
      required:
      - email
      - fecha_alta
      - id
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
